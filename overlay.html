<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBS Overlay</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Noto Sans Thai","Sukhumvit Set",sans-serif}.lower{--accent:#ff5c35;--scale:1;position:absolute;left:5%;bottom:8%;width:760px;height:150px;opacity:0;filter:blur(3px);transform:translateX(-130px) scale(var(--scale));transform-origin:left bottom;transition:opacity .42s ease,filter .5s ease,transform .68s cubic-bezier(.16,1,.3,1)}.lower.visible{opacity:1;filter:none;transform:translateX(0) scale(var(--scale))}.panel{position:absolute;inset:0;padding:27px 38px 24px 142px;overflow:hidden;border:1px solid #ffffff25;border-left:14px solid var(--accent);background:linear-gradient(110deg,#10131ef5,#252b39eF);clip-path:polygon(0 0,100% 0,96% 100%,0 100%);box-shadow:0 18px 42px #0008}.logo{position:absolute;z-index:2;top:26px;left:34px;width:94px;height:94px;border:4px solid color-mix(in srgb,var(--accent) 65%,white);border-radius:50%;object-fit:cover;background:#fff}.logo[src=""]{display:none}.name{overflow:hidden;color:#fff;font-size:39px;font-weight:800;line-height:1.15;text-overflow:ellipsis;white-space:nowrap}.title{margin-top:8px;color:#d4d9e2;font-size:21px}.lower.glass .panel{border-radius:18px;background:#182033b9;backdrop-filter:blur(16px);clip-path:none}.lower.neon .panel{border:2px solid var(--accent);box-shadow:0 0 26px color-mix(in srgb,var(--accent) 55%,transparent),inset 0 0 30px #000}.lower.minimal{height:112px}.lower.minimal .panel{padding:22px 30px 18px 124px;clip-path:none}.lower.minimal .logo{top:18px;width:76px;height:76px}.lower.minimal .name{font-size:32px}.lower.ribbon .panel{background:linear-gradient(105deg,var(--accent),#171b26)}.ticker{position:absolute;right:0;bottom:0;left:0;display:flex;height:58px;align-items:center;overflow:hidden;border-top:3px solid #ffffff75;background:var(--bg,#d8191f);color:var(--color,#fff);font-size:23px;font-weight:800;opacity:0;transform:translateY(100%);transition:.35s}.ticker.visible{opacity:1;transform:none}.ticker span{display:inline-block;min-width:max-content;padding-left:100%;animation:marquee 25s linear infinite}.timer{position:absolute;top:4%;left:4%;min-width:142px;padding:15px 20px;border:2px solid var(--color,#fff);border-radius:11px;background:var(--bg,#12141b);color:var(--color,#fff);font:800 38px/1 monospace;text-align:center;opacity:0;transform:translateY(-15px);transition:.3s}.timer.visible{opacity:1;transform:none}@keyframes marquee{to{transform:translateX(-100%)}}
</style></head><body><section id="lower" class="lower"><img id="logo" class="logo" alt=""><div class="panel"><div id="name" class="name"></div><div id="title" class="title"></div></div></section><aside id="timer" class="timer">00:00</aside><div id="ticker" class="ticker"><span id="tickerText"></span></div><script>
const KEY='obs-control-pages-overlay-v1',channel=new BroadcastChannel('obs-control-overlay');let current={};const $=id=>document.getElementById(id);const positions={'top-left':{top:'4%',left:'4%'},'top-right':{top:'4%',right:'4%'},'bottom-left':{bottom:'8%',left:'4%'},'bottom-right':{bottom:'8%',right:'4%'}};
function paint(state){current=state||{};$('name').textContent=current.name||'';$('title').textContent=current.title||'';$('logo').src=current.logoUrl||'';$('lower').style.setProperty('--accent',current.accent||'#ff5c35');$('lower').style.setProperty('--scale',current.scale||1);$('lower').className=`lower ${current.template||'classic'} ${current.visible?'visible':''}`;$('tickerText').textContent=current.ticker||'';$('ticker').classList.toggle('visible',Boolean(current.tickerVisible&&current.ticker));$('ticker').style.setProperty('--bg',current.tickerBackground||'#d8191f');$('ticker').style.setProperty('--color',current.tickerColor||'#fff');$('timer').classList.toggle('visible',Boolean(current.timerVisible));$('timer').style.setProperty('--bg',current.timerBackground||'#12141b');$('timer').style.setProperty('--color',current.timerColor||'#fff');Object.assign($('timer').style,{top:'',right:'',bottom:'',left:''},positions[current.timerPosition]||positions['top-left']);tick()}
function tick(){let seconds=current.timerSeconds||0;if(current.timerRunning&&current.timerStartedAt)seconds=Math.floor((Date.now()-current.timerStartedAt)/1000);$('timer').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
channel.onmessage=e=>paint(e.data);addEventListener('storage',e=>{if(e.key===KEY)try{paint(JSON.parse(e.newValue))}catch{}});try{paint(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{}setInterval(()=>{try{paint(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{}},1000);
</script></body></html>
